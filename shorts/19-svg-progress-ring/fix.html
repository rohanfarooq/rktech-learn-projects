<!-- From the pomodoro timer in projects/07-pomodoro-timer/index.html -->
<!-- Two circles with the same radius: a grey track and the progress ring on top. -->
<!-- The CSS rotates the svg -90deg so the ring starts at the top. -->
<div class="ring">
  <svg viewBox="0 0 200 200">
    <circle class="ring-track" cx="100" cy="100" r="90" />
    <circle id="ring-progress" class="ring-progress" cx="100" cy="100" r="90" />
  </svg>
</div>
