<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quiz App</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app">
    <header class="top">
      <h1>JS Quiz</h1>
      <p class="best">High score: <span id="high-score">0</span></p>
    </header>

    <section id="start-screen" class="screen">
      <p>8 questions. 15 seconds each. How many can you get right?</p>
      <button id="start-btn" type="button">Start quiz</button>
    </section>

    <section id="quiz-screen" class="screen" hidden>
      <div class="bar">
        <span id="progress">Question 1 of 8</span>
        <span id="timer" class="timer">15</span>
      </div>
      <h2 id="question">Question text</h2>
      <div id="answers" class="answers"></div>
      <p id="feedback" class="feedback"></p>
      <div class="bar">
        <span>Score: <strong id="score">0</strong></span>
        <button id="next-btn" type="button" hidden>Next</button>
      </div>
    </section>

    <section id="end-screen" class="screen" hidden>
      <h2 id="final">You scored 0 out of 8</h2>
      <p id="best-msg"></p>
      <button id="again-btn" type="button">Play again</button>
    </section>
  </main>

  <script src="questions.js"></script>
  <script src="script.js"></script>
</body>
</html>
